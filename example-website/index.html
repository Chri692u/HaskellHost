<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HaskellHost Proxy Test</title>
  <style>
    body {
      font-family: monospace;
      padding: 1rem;
      background: #111;
      color: #eee;
    }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #1e1e1e;
      padding: 1rem;
      border-radius: 6px;
      max-height: 80vh;
      overflow: auto;
    }
    button {
      padding: 0.5rem 1rem;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>HaskellHost Proxy Test</h1>
  <p>Using .env key: <strong>KANYE_API_KEY</strong> = <strong>kanye</strong></p>

  <button id="load">Fetch Kanye Quote</button>

  <pre id="output">Click the button to fetch a quote…</pre>

  <script>
    const output = document.getElementById("output");
    const button = document.getElementById("load");
    const placeholderUrl = "https://api.${KANYE_API_KEY}.rest/";
    const expectedUrl = placeholderUrl.replace("${KANYE_API_KEY}", "kanye");

    button.onclick = async () => {
      output.textContent = `Input URL (with placeholder):\n${placeholderUrl}\n\nExpected URL sent by proxy:\n${expectedUrl}\n\nLoading…`;
      try {
        const response = await fetch(
          `/api/proxy?url=${encodeURIComponent(placeholderUrl)}`
        );
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const text = await response.text();
        let content;
        try {
          const json = JSON.parse(text);
          content = JSON.stringify(json, null, 2);
        } catch (_) {
          content = text;
        }
        output.textContent = 
          `Input URL (with placeholder):\n${placeholderUrl}\n\n` +
          `Expected URL sent by proxy:\n${expectedUrl}\n\n` +
          `Response:\n${content}\n\n` +
          `Thank you Kanye for the wisdom! It truly makes you think.`;

      } catch (err) {
        output.textContent = 
          `Input URL (with placeholder):\n${placeholderUrl}\n\n` +
          `Expected URL sent by proxy:\n${expectedUrl}\n\n` +
          `Error:\n${err.toString()}`;
      }
    };
  </script>
</body>
</html>
